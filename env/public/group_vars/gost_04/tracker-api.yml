---
tracker_api_version: "0.12.1"
tracker_api_port: 18788

# Secrets live in the g1 Infisical project (mapped in infisical.yml).
tracker_api_database_url: "{{ infisical_dict_users_secret_g1.tracker_api_database_url }}"
tracker_api_apns_key_id: "{{ infisical_dict_users_secret_g1.tracker_api_apns_key_id }}"
tracker_api_apns_p8: "{{ infisical_dict_users_secret_g1.tracker_api_apns_p8 }}"
tracker_api_apns_team_id: "{{ infisical_dict_users_secret_g1.tracker_api_apns_team_id }}"
tracker_api_rate_hub_api_key: "{{ infisical_dict_users_secret_g1.tracker_api_rate_hub_api_key }}"
tracker_api_admin_token: "{{ infisical_dict_users_secret_g1.tracker_api_admin_token }}"

# Notixy delivery of price-target alerts (sigma-tracker-api >= 0.12.0, sigma-tracker #1230): through
# sender-api's partner surface on this host (sender-api role listen addr 127.0.0.1:8091, host
# networking, so loopback). The client appends /v1/messages to this URL.
tracker_api_notixy_api_url: "http://127.0.0.1:8091/partner"

# Partner key issued by sender-api for the SigmaTracker sender (POST /admin/v1/senders/{id}/keys, shown once).
tracker_api_notixy_send_key: "{{ infisical_dict_users_secret_g1.tracker_api_notixy_send_key }}"
# SigmaTracker's sender id on sender-api: a lowercase uuid. A missing or non-uuid value turns Notixy
# sending off with one ERROR log; the API still starts.
tracker_api_notixy_sender_id: "116490da-2863-498b-bfb1-e623f4674c4d"



# Optional RPC keys. Omitted from the env file when the Infisical value is empty.
# Put ANKR_API_KEY and HELIUS_API_KEY at secret path / in the sigma-tracker project.
# ANKR_API_KEY is the 64-hex key from the endpoint URL (https://rpc.ankr.com/<chain>/<key>); since
# 0.12.0 it also drives GET /v1/wallet/tokens and EVM wallet history (Ankr multichain). Without it
# those answer 503 and the app falls back.
tracker_api_ankr_api_key: "{{ infisical_dict_users_secret_g1.tracker_api_ankr_api_key }}"
tracker_api_helius_api_key: "{{ infisical_dict_users_secret_g1.tracker_api_helius_api_key }}"

# Backend-served app settings (GET /v1/app/settings, sigma-tracker-api >= 0.11.0). Overrides the app's
# compiled-in rate-hub hosts without an app release. Fill in the real reserve/regional hosts.
# tracker_api_app_settings:
#   rateHub:
#     global: "https://rate-global.sky-1.org"
#     reserve: "https://<reserve-host>"
#     regional:
#       RU: "https://<ru-host>"

tracker_api_env_extra:
  # angie in front: one proxy hop rewrites X-Forwarded-For.
  AUTH_TRUSTED_PROXY_HOPS: 1
  # # first test only, set false after — README Deploy step 7.
  # AUTH_ALLOW_UNATTESTED: "true"
