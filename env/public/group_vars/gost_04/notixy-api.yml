---
# API
notixy_api_version: "0.22.0-a43e373"

# PWA
notixy_pwa_version: "0.2.0-fa729f5"



# 8080 is taken by kora_devnet on this host; angie upstream notixy_api points here.
notixy_api_listen_addr: "127.0.0.1:18789"
# Public origin for the join page QR (the host sender-api uses as SENDER_NOTIXY_URL).
notixy_api_public_base_url: "https://notixy-ios-api.sky-1.org"

# Secrets live in the g1 Infisical project (mapped in infisical.yml).
# Shared local Postgres (psql.yml).
notixy_api_postgres_password: "{{ infisical_dict_users_secret_g1.notixy_api_postgres_password | default('changeme') }}"
notixy_api_database_url: "postgres://notixy:{{ notixy_api_postgres_password | urlencode }}@127.0.0.1:5432/notixy?sslmode=disable"
notixy_api_send_token: "{{ infisical_dict_users_secret_g1.notixy_api_send_token }}"
# sender-api runs on this host with host networking (roles/sender-api: sender_api_listen_addr).
notixy_api_sender_api_url: "http://127.0.0.1:8091"
# Same value sender-api must accept on its /internal/v1 (sender-api#201).
notixy_api_sender_api_token: "{{ infisical_dict_users_secret_g1.notixy_api_sender_api_token }}"
notixy_api_apns_key_id: "{{ infisical_dict_users_secret_g1.notixy_api_apns_key_id }}"
notixy_api_apns_p8: "{{ infisical_dict_users_secret_g1.notixy_api_apns_p8 }}"
notixy_api_apns_team_id: "{{ infisical_dict_users_secret_g1.notixy_api_apns_team_id }}"
# Bundle id of the iOS app (notixy-ios project.yml); not a secret.
notixy_api_apns_topic: "app.heaven8.notixy"
# Web Push VAPID keypair from Infisical (the public key travels with its private key; a missing one stops the play before any change).
notixy_api_webpush_vapid_public_key: "{{ infisical_dict_users_secret_g1.notixy_api_webpush_vapid_public_key }}"
notixy_api_webpush_vapid_private_key: "{{ infisical_dict_users_secret_g1.notixy_api_webpush_vapid_private_key }}"
notixy_api_webpush_subject: "https://notixy.app"




# Loopback port of the notixy-pwa container. Angie upstream notixy_pwa points here.
notixy_pwa_port: 8093
# notixy-api listens on notixy_api_listen_addr (host network).
notixy_pwa_api_url: "http://127.0.0.1:18789"

