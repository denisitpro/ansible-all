---
notixy_api_version: "0.1.0"
# 8080 is taken by kora_devnet on this host; angie upstream notixy_api points here.
notixy_api_listen_addr: "127.0.0.1:18789"

# Secrets live in the g1 Infisical project (mapped in infisical.yml).
notixy_api_send_token: "{{ infisical_dict_users_secret_g1.notixy_api_send_token }}"
notixy_api_apns_key_id: "{{ infisical_dict_users_secret_g1.notixy_api_apns_key_id }}"
notixy_api_apns_p8: "{{ infisical_dict_users_secret_g1.notixy_api_apns_p8 }}"
notixy_api_apns_team_id: "{{ infisical_dict_users_secret_g1.notixy_api_apns_team_id }}"
# Bundle id of the iOS app (notixy-ios project.yml); not a secret.
notixy_api_apns_topic: "app.heaven8.notixy"
