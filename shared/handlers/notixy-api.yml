---
- name: recreate-docker notixy-api
  community.docker.docker_compose_v2:
    project_src: "{{ notixy_api_compose_path }}"
    state: present
    recreate: always
    pull: always

- name: restart-docker notixy-api
  community.docker.docker_compose_v2:
    project_src: "{{ notixy_api_compose_path }}"
    state: restarted
