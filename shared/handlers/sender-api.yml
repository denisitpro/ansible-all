---
- name: recreate-docker sender-api
  community.docker.docker_compose_v2:
    project_src: "{{ sender_api_compose_path }}"
    state: present
    recreate: always
    pull: always

- name: restart-docker sender-api
  community.docker.docker_compose_v2:
    project_src: "{{ sender_api_compose_path }}"
    state: restarted
