---
- name: recreate-docker rate-hub
  community.docker.docker_compose_v2:
    project_src: "{{ rate_hub_compose_path }}"
    state: present
    recreate: always
    pull: always

- name: restart-docker rate-hub
  community.docker.docker_compose_v2:
    project_src: "{{ rate_hub_compose_path }}"
    state: restarted
