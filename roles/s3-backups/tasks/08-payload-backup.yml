---
- name: Ensure scripts directory exists
  ansible.builtin.file:
    path: /opt/scripts
    state: directory
    mode: '0755'
    owner: root
    group: root

- name: Ensure rclone log directory exists
  ansible.builtin.file:
    path: "{{ payload_backup_log_dir }}"
    state: directory
    mode: '0755'
    owner: root
    group: root

- name: Deploy payload backup script
  ansible.builtin.template:
    src: payload-backup.sh.j2
    dest: /opt/scripts/payload-backup.sh
    mode: '0755'
    owner: root
    group: root
