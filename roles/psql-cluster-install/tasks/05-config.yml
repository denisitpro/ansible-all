---
- name: "[psql-cluster/config] Deploy PostgreSQL config templates"
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ psql_node_data_conf }}/{{ item }}"
    owner: "root"
    group: "root"
    mode: "0644"
  with_items:
    - postgresql.conf
    - pg_hba.conf
  notify: recreate-docker postgres
