---
# Helm chart versions for all components
# Centralized version management for easier updates and overview
helm_longhorn_version: "1.11.2"
helm_ingress_nginx_version: "4.15.1"
helm_prometheus_version: "85.1.3"
helm_cert_manager_version: "1.20.2"
helm_argocd_version: "9.5.14"
helm_loki_version: "7.0.0"
helm_vector_version: "0.52.0"
helm_teleport_version: "18.8.1"
helm_vso_version: "1.4.0"
helm_vai_version: "0.32.0"
metrics_server_helm_version: "3.13.0"
helm_kong_version: "3.2.0"
helm_traefik_version: "40.2.0"
helm_cnpg_version: "0.28.2"
helm_haproxy_version: "1.28.1"

helm_componets_list:
  - longhorn
  - ingress-nginx
  - prometheus
  - teleport-agent
  - vso
  - vai
  - cert-manager
  - hubble-ui
  - metrics-server
  - loki
  - vector
  # - cnpg
  # - kong

k8s_cls_shortname: "k8s-default-cls"
k8s_prom_cluster_id: "{{ k8s_cls_shortname }}-prom"

argocd_github_client_id: "{{ vault_dict_users_secret_g2.argocd_github.client_id | default('set_me') }}"
argocd_github_secret_id: "{{ vault_dict_users_secret_g2.argocd_github.secret_id | default('set_me') }}"

argocd_dockerhub_oci_name: "{{ vault_dict_users_secret_g2.argocd_dockerhub_oci_cred.helm_charts_v1_pull_login | default('dockerhub_org_name') }}"
argocd_dockerhub_oci_pass: "{{ vault_dict_users_secret_g2.argocd_dockerhub_oci_cred.helm_charts_v1_pull_token | default('set_me') }}"

teleport_k8s_agent_token: "{{ vault_dict_users_secret_g2.teleport_tokens.teleport_k8s_agent_token | default('set_me') }}"

# vault g1
# k8s_cert_manager_cloudflare_token: "{{ vault_dict_users_secret.k8s_cert_manager_cloudflare_token | default('set_me') }}"

# vault g2
k8s_cert_manager_cloudflare_token: "{{ vault_dict_users_secret_g2.k8s_cert_manager_cloudflare_token.k8s_cert_manager_cloudflare_token | default('set_me') }}"

# Cert-manager configuration
k8s_cert_manager_type: "cloudflare" # http or cloudflare

k8s_teleport_agent_kub_cluster_base_labels:
  region: "unknown"
  platform: "amd64"
  stand: "example"

teleport_app_acl_access_level:
  - name: "argocd-example"
    app_acl_level: [900]

k8s_teleport_agent_kubernetes_discovery:
  - types: ["app"]
    namespaces: ["example-app"]
    labels:
      app_acl_level900: "900"

# Discovery group for unique identification of teleport agents
k8s_teleport_agent_discovery_group: "{{ k8s_cls_fqdn | default('k8s-example.example.com') }}"

# Teleport DB access (optional). When enabled, agent gets 'db' role and
# registers static databases from k8s_teleport_agent_databases list.
# Supported protocols: postgres, mysql, redis (valkey is wire-compatible with redis).
# Auth is handled Teleport-side (certs or teleport-db-user mapping), no passwords here.
# Example:
# k8s_teleport_agent_databases:
#   - name: "pg-app"
#     protocol: "postgres"
#     uri: "pg.svc.cluster.local:5432"
#     static_labels:
#       env: "dev"
k8s_teleport_agent_db_enabled: false
k8s_teleport_agent_databases: []

k8s_teleport_agent_static_apps: []

k8s_teleport_exec_all_pods_enabled: false
k8s_teleport_exec_all_pods_group: "k8s-acl-250"

k8s_teleport_exec_ns_scoped_enabled: false
k8s_teleport_exec_ns_scoped_namespace: ""
k8s_teleport_exec_ns_scoped_group: ""

# Optional: mount DB server CA bundles from existing k8s Secrets.
# Each item produces an extraVolume + extraVolumeMount at /etc/teleport-tls/<name>/ca.crt.
# Reference a mount from a database entry via its `ca_mount` field (see example below).
# Example:
# k8s_teleport_agent_db_ca_mounts:
#   - name: pg-base-ca                           # volume name + subpath
#     secretName: postgres-base-cluster-server-ca
#     key: ca.crt                                # optional, defaults to ca.crt
#
# k8s_teleport_agent_databases:
#   - name: payload-postgres-base-rw
#     protocol: postgres
#     uri: postgres-base-cluster-rw.k3.svc.cluster.local:5432
#     ca_mount: pg-base-ca                       # links to the mount above
#     static_labels: { env: "c3-dev" }
k8s_teleport_agent_db_ca_mounts: []

