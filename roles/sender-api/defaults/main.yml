---
sender_api_image: "denisitpro/sender-api"
sender_api_version: "latest"

sender_api_compose_path: "/opt/docker/sender-api"

# Host networking behind angie: listen on loopback only.
sender_api_listen_addr: "127.0.0.1:8091"
sender_api_notixy_url: "https://notixy-ios-api.sky-1.org"

# Mandatory: must be overridden.
sender_api_database_url: "set_me"
sender_api_notixy_token: "set_me"
# Bearer notixy-api presents on sender-api /internal/v1; equals notixy-api NOTIXY_SENDER_API_TOKEN.
sender_api_internal_token: "set_me"

# Optional: global operator created at startup when the login is unused.
sender_api_bootstrap_operator_login: ""
sender_api_bootstrap_operator_password: ""

# Subscriber-read cache (sender-api#142): sender-api's own Valkey container in this compose
# (#414), never the host Valkey other services use. Cache only: no persistence. The password is
# mandatory (protection is the credential, not the network).
sender_api_valkey_image: "valkey/valkey"
sender_api_valkey_version: "9.1-alpine3.24"
sender_api_valkey_bind: "127.0.0.1"
sender_api_valkey_port: 6380
sender_api_valkey_maxmemory: "128mb"
sender_api_valkey_password: "set_me"
sender_api_valkey_addr: "{{ sender_api_valkey_bind }}:{{ sender_api_valkey_port }}"
sender_api_valkey_db: 0
sender_api_valkey_username: ""
sender_api_cache_ttl: "15s"
