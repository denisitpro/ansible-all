---
- name: check for existing k3s systemd unit
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ k3s_service_name }}.service"
  register: k3s_unit_stat

- name: download k3s installer
  ansible.builtin.get_url:
    url: "{{ k3s_installer_url }}"
    dest: "/usr/local/sbin/k3s-installer.sh"
    mode: '0755'
    owner: root
    group: root

# Airgap escape hatch — see defaults/main.yml (k3s_local_binary_path). On
# RKN-restricted hosts install.sh can reach get.k3s.io but not the GitHub
# releases it downloads the binary from, so the binary is staged manually and
# install.sh runs with INSTALL_K3S_SKIP_DOWNLOAD=true. Empty var = online install.
- name: stage pre-downloaded k3s binary (airgap)
  ansible.builtin.copy:
    src: "{{ k3s_local_binary_path }}"
    dest: "{{ k3s_binary_path }}"
    mode: '0755'
    owner: root
    group: root
    remote_src: true
  when:
    - k3s_local_binary_path | length > 0
    - not k3s_unit_stat.stat.exists

# Optional pre-staged airgap images tarball. k3s imports every archive in this
# directory into its embedded containerd on first start.
- name: ensure k3s agent images dir exists (airgap)
  ansible.builtin.file:
    path: "{{ k3s_airgap_images_dir }}"
    state: directory
    mode: '0755'
    owner: root
    group: root
  when: k3s_local_airgap_images_path | length > 0

- name: stage pre-downloaded airgap images tarball (airgap)
  ansible.builtin.copy:
    src: "{{ k3s_local_airgap_images_path }}"
    dest: "{{ k3s_airgap_images_dir }}/{{ k3s_local_airgap_images_path | basename }}"
    mode: '0644'
    owner: root
    group: root
    remote_src: true
  when:
    - k3s_local_airgap_images_path | length > 0
    - not k3s_unit_stat.stat.exists

- name: install k3s server (single node)
  ansible.builtin.command: /usr/local/sbin/k3s-installer.sh
  environment:
    INSTALL_K3S_CHANNEL: "{{ k3s_channel }}"
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    # When the binary is pre-staged, tell install.sh to use it instead of
    # downloading from GitHub releases (RKN-blocked on msk hosts).
    INSTALL_K3S_SKIP_DOWNLOAD: "{{ 'true' if k3s_local_binary_path | length > 0 else 'false' }}"
  args:
    creates: "/etc/systemd/system/{{ k3s_service_name }}.service"

- name: ensure k3s service is enabled and started
  ansible.builtin.systemd_service:
    name: "{{ k3s_service_name }}"
    state: started
    enabled: true
    daemon_reload: true
