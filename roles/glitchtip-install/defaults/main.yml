---
glitchtip_image: glitchtip/glitchtip
glitchtip_version: "6.2.0"

glitchtip_compose_path: /opt/docker/glitchtip
glitchtip_uploads_path: /opt/glitchtip/uploads

glitchtip_port: 8000
glitchtip_domain: "http://{{ inventory_hostname }}:{{ glitchtip_port }}"

glitchtip_db_host: localhost
glitchtip_db_port: 5432
glitchtip_db_name: glitchtip
glitchtip_db_user: glitchtip
glitchtip_db_password: "{{ vault_dict_users_secret_g2.glitchtip_secrets.db_password | default('changeme') }}"

glitchtip_secret_key: "{{ vault_dict_users_secret_g2.glitchtip_secrets.secret_key | default('changeme') }}"
glitchtip_admin_email: "{{ vault_dict_users_secret_g2.glitchtip_secrets.admin_email | default('admin@example.com') }}"
glitchtip_admin_password: "{{ vault_dict_users_secret_g2.glitchtip_secrets.admin_password | default('changeme') }}"

glitchtip_redis_host: 127.0.0.1
glitchtip_redis_port: "{{ redis_port | default(6379) }}"
glitchtip_redis_password: "{{ vault_dict_users_secret_g2.glitchtip_secrets.redis_password | default('') }}"

glitchtip_celery_autoscale: "1,3"
glitchtip_celery_max_tasks_per_child: "10000"
glitchtip_worker_max_concurrency: 4

glitchtip_google_oauth_enabled: false
glitchtip_google_client_id: "{{ vault_dict_users_secret_g2.glitchtip_secrets.google_client_id | default('') }}"
glitchtip_google_client_secret: "{{ vault_dict_users_secret_g2.glitchtip_secrets.google_client_secret | default('') }}"

glitchtip_smtp_password: ""
glitchtip_email_url: "consolemail://"
glitchtip_default_from_email: "glitchtip@example.com"
