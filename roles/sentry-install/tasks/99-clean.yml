---
- name: Stop Sentry stack
  community.docker.docker_compose_v2:
    project_src: "{{ sentry_compose_path }}"
    state: absent
  ignore_errors: true

- name: Remove sentry directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ sentry_compose_path }}"
    - "{{ sentry_data_path }}"
