---
rate_hub_api_image: "denisitpro/rate-api"
rate_hub_collector_image: "denisitpro/rate-collector"
rate_hub_version: "latest"
rate_hub_api_version: "{{ rate_hub_version }}"
rate_hub_collector_version: "{{ rate_hub_version }}"

rate_hub_uid: 1006
rate_hub_gid: 1006

rate_hub_compose_path: "/opt/docker/rate-hub"
rate_hub_base_path: "/opt/rate-hub"

rate_hub_x402_enabled: false

# Local Postgres (one instance, one database), data in a host directory.
# Connection strings are set by the owner in rate_hub_database_url / rate_hub_x402_database_url.
rate_hub_postgres_enabled: true
# postgres alpine image user
rate_hub_postgres_uid: 70
rate_hub_postgres_gid: 70
rate_hub_postgres_data_path: "{{ rate_hub_base_path }}/postgres"
rate_hub_postgres_password: "{{ vault_dict_users_secret_g2.rate_hub_postgres.password | default('changeme') }}"
