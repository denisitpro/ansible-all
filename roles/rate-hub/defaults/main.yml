---
rate_hub_api_image: "denisitpro/rate-api"
rate_hub_collector_image: "denisitpro/rate-collector"
rate_hub_version: "latest"
rate_hub_api_version: "{{ rate_hub_version }}"
rate_hub_collector_version: "{{ rate_hub_version }}"

rate_hub_uid: 1006
rate_hub_gid: 1006

rate_hub_compose_path: "/opt/docker/rate-hub"
rate_hub_base_path: "/opt/rate-hub"

rate_hub_x402_enabled: false

# Local Postgres for DATABASE_URL and X402_DATABASE_URL (one instance, one database).
# Set false to use external URLs from rate_hub_database_url / rate_hub_x402_database_url.
rate_hub_postgres_enabled: true
rate_hub_postgres_image: "postgres:18-alpine"
rate_hub_postgres_user: "ratehub"
rate_hub_postgres_db: "ratehub"
# Vault key the owner must add: vault_dict_users_secret_g2.rate_hub_postgres.password
# No default on purpose: a missing key must fail the render.
rate_hub_postgres_password: "{{ vault_dict_users_secret_g2.rate_hub_postgres.password }}"
rate_hub_postgres_port: 5432
rate_hub_postgres_volume: "rate-hub-postgres"
rate_hub_postgres_url: >-
  postgres://{{ rate_hub_postgres_user }}:{{ rate_hub_postgres_password | urlencode }}@127.0.0.1:{{ rate_hub_postgres_port }}/{{ rate_hub_postgres_db }}?sslmode=disable
