---
- name: copy compose-file - rate-hub
  ansible.builtin.template:
    src: "docker-compose.rate-hub.yml.j2"
    dest: "{{ rate_hub_compose_path }}/docker-compose.yml"
    mode: "0600"
  notify: restart-docker rate-hub
  
- name: Ensure docker-compose is applied and containers are recreated if needed
  community.docker.docker_compose_v2:
    project_src: "{{ rate_hub_compose_path }}"
    state: present
    recreate: auto
    pull: always
