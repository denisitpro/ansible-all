---
- name: copy env-file - rate-api
  ansible.builtin.template:
    src: "rate-api.remote.env.j2"
    dest: "{{ rate_hub_compose_path }}/rate-api.remote.env"
    mode: "0600"
  notify: restart-docker rate-hub

- name: copy env-file - rate-collector
  ansible.builtin.template:
    src: "rate-collector.remote.env.j2"
    dest: "{{ rate_hub_compose_path }}/rate-collector.remote.env"
    mode: "0600"
  notify: restart-docker rate-hub

- name: copy env-file - rate-api-x402
  ansible.builtin.template:
    src: "rate-api-x402.remote.env.j2"
    dest: "{{ rate_hub_compose_path }}/rate-api-x402.remote.env"
    mode: "0600"
  when: rate_hub_x402_enabled
  notify: restart-docker rate-hub
