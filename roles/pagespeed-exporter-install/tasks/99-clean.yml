---
- name: stop and remove pagespeed-exporter container
  community.docker.docker_compose_v2:
    project_src: "{{ pagespeed_exporter_compose_path }}"
    state: absent
  ignore_errors: true

- name: remove pagespeed-exporter directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  with_items:
    - "{{ pagespeed_exporter_compose_path }}"
    - "{{ pagespeed_exporter_base_path }}"

- name: remove consul registration
  ansible.builtin.file:
    path: /etc/consul.d/pagespeed-exporter.hcl
    state: absent
  notify: restart-docker consul
