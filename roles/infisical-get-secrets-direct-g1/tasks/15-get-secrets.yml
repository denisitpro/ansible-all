---
# - name: Debug Infisical API paths to be read
#   ansible.builtin.debug:
#     msg: "Would read from: {{ infisical_api_url }}/api/v4/secrets/{{ item.secret_name }}?secretPath={{ item.secret_path }}"
#   with_items: "{{ infisical_sum_g1 }}"

- name: Set Infisical configuration to use
  ansible.builtin.set_fact:
    infisical_sum_g1: "{{ (infisical_global_g1 | default([])) + (infisical_extend_g1 | default([])) + (infisical_g1_role_override | default([])) }}"

- name: Get secrets from Infisical (infisical g1)
  ansible.builtin.shell: |
    curl --silent --show-error \
    --max-time 10 \
    --connect-timeout 5 \
    --header "Authorization: Bearer {{ infisical_access_token }}" \
    --request GET \
    "{{ infisical_api_url }}/api/v4/secrets/{{ item.secret_name }}?projectId={{ item.project_id | default(infisical_project_id) }}&environment={{ item.environment | default(infisical_environment) }}&secretPath={{ item.secret_path }}"
  register: infisical_key_values
  with_items: "{{ infisical_sum_g1 }}"
  retries: 2
  delay: 3
  until: infisical_key_values is succeeded

- name: Set list users secrets - no_log enable
  ansible.builtin.set_fact:
    infisical_list_users_secret_g1: >-
      {{
        infisical_list_users_secret_g1 | default([]) + [
          {
            'key_name': item.item.name,
            'value': (item.stdout | from_json).secret.secretValue
          }
        ]
      }}
  with_items: "{{ infisical_key_values.results }}"
  no_log: true

- name: Check all secret values are present and non-empty
  ansible.builtin.assert:
    that:
      - item.value is defined
      - item.value | length > 0
    fail_msg: "Secret {{ item.key_name }} has a missing or empty value"
    success_msg: "Secret {{ item.key_name }} is complete"
  loop: "{{ infisical_list_users_secret_g1 }}"
  loop_control:
    label: "{{ item.key_name }}"
  no_log: true

- name: Set dict users secrets
  ansible.builtin.set_fact:
    infisical_dict_users_secret_g1: "{{ infisical_list_users_secret_g1 | items2dict(key_name='key_name', value_name='value') }}"
# - name: Print collected user secrets (for debug)
#   ansible.builtin.debug:
#     var: infisical_dict_users_secret_g1
