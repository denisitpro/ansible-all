---
tracker_api_image: "denisitpro/tracker-api"
tracker_api_version: "0.1.1"

tracker_api_compose_path: "/opt/docker/tracker-api"

tracker_api_port: 8788

# Extra KEY=value pairs appended to the env file (server defaults apply otherwise).
tracker_api_env_extra: {}

# Mandatory: must be overridden.
tracker_api_database_url: "set_me"
tracker_api_apns_key_id: "set_me"
tracker_api_apns_p8: "set_me"
tracker_api_apns_team_id: "set_me"
tracker_api_rate_hub_api_key: "set_me"

# Optional: Notixy delivery of price-target alerts (sigma-tracker-api #933, experimental).
# Feature is off unless BOTH url and send key are non-empty. The send key is a secret.
tracker_api_notixy_api_url: ""
tracker_api_notixy_send_key: ""
tracker_api_notixy_sender_id: "sigma-tracker"

# Optional RPC provider keys. Written to the env file only when non-empty.
tracker_api_ankr_api_key: ""
tracker_api_helius_api_key: ""

# Optional: backend-served app settings (sigma-tracker-api >= 0.11.0, GET /v1/app/settings, #1160).
# A dict rendered as APP_SETTINGS_JSON; written only when non-empty. Empty → the endpoint serves
# `settings: null` and the app keeps its compiled-in rate-hub hosts. Shape:
#   rateHub: { global: "https://…", reserve: "https://…", regional: { RU: "https://…" } }
# Absolute https hosts only; one invalid member drops the whole value (logged, fail open).
tracker_api_app_settings: {}
